<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Toernooiplanner Clubkampioenschappen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Plan: sporthal-groen als accent, koel-grijze neutrals; scorebord-letter voor koppen, rustige sans voor tekst.
   Layout: vaste kop met samenvatting, tabbladen, daaronder het werkvlak. */
:root {
  --bg: #f3f5f4; --vlak: #ffffff; --inkt: #18221f; --zacht: #5b6964; --lijn: #d8dfdc;
  --accent: #116149; --accent-zacht: #e0efe9;
  --goed: #1f7a4d; --waarschuwing: #a86500; --fout: #b3261e;
  --waarschuwing-zacht: #fff3df; --fout-zacht: #fdeceb;
  --HE: #2f6fb3; --DE: #b2447a; --HD: #2b8a8a; --DD: #8a5bb5; --GD: #c26a18;
  --display: "Barlow Semi Condensed", "Arial Narrow", sans-serif;
  --tekst: "Source Sans 3", "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111715; --vlak: #19211e; --inkt: #e6ece9; --zacht: #9aa8a2; --lijn: #2c3733;
    --accent: #4cc39a; --accent-zacht: #1d3b31;
    --goed: #5fd39b; --waarschuwing: #f0b04a; --fout: #ff8a80;
    --waarschuwing-zacht: #3a2c12; --fout-zacht: #3d1d1b;
    --HE: #6fa8e6; --DE: #e57fb0; --HD: #5cc6c6; --DD: #b693e0; --GD: #f0a058;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111715; --vlak: #19211e; --inkt: #e6ece9; --zacht: #9aa8a2; --lijn: #2c3733;
  --accent: #4cc39a; --accent-zacht: #1d3b31;
  --goed: #5fd39b; --waarschuwing: #f0b04a; --fout: #ff8a80;
  --waarschuwing-zacht: #3a2c12; --fout-zacht: #3d1d1b;
  --HE: #6fa8e6; --DE: #e57fb0; --HD: #5cc6c6; --DD: #b693e0; --GD: #f0a058;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--inkt); font: 15px/1.45 var(--tekst); }
h1, h2, h3 { font-family: var(--display); font-weight: 600; text-wrap: balance; margin: 0; letter-spacing: .01em; }
h1 { font-size: 26px; }
h2 { font-size: 21px; }
h3 { font-size: 17px; }
button, select, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
.wrap { max-width: 1280px; margin: 0 auto; padding: 0 16px; }
header.kop { background: var(--vlak); border-bottom: 1px solid var(--lijn); padding: 14px 0 0; position: sticky; top: 0; z-index: 5; }
.koprij { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: space-between; }
.bron { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 14px; color: var(--zacht); }
.tegels { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0; }
.tegel { background: var(--bg); border: 1px solid var(--lijn); border-radius: 8px; padding: 6px 12px; min-width: 104px; }
.tegel b { display: block; font-family: var(--display); font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; }
.tegel span { font-size: 12.5px; color: var(--zacht); }
.tegel.probleem { border-color: var(--fout); background: var(--fout-zacht); }
.tegel.letop { border-color: var(--waarschuwing); background: var(--waarschuwing-zacht); }
nav.tabs { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; }
nav.tabs button { border: 0; background: none; padding: 10px 14px; border-bottom: 3px solid transparent; cursor: pointer; white-space: nowrap; color: var(--zacht); font-weight: 600; }
nav.tabs button[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); }
nav.tabs .badge { display: inline-block; min-width: 18px; padding: 0 5px; margin-left: 4px; border-radius: 9px; background: var(--waarschuwing); color: var(--vlak); font-size: 12px; line-height: 18px; text-align: center; }
main { padding: 18px 0 48px; }
.paneel { background: var(--vlak); border: 1px solid var(--lijn); border-radius: 10px; padding: 16px; }
.stapel { display: grid; gap: 16px; }
.rij { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; }
.zacht { color: var(--zacht); }
.klein { font-size: 13px; }
.knop { border: 1px solid var(--lijn); background: var(--vlak); border-radius: 7px; padding: 6px 12px; cursor: pointer; font-weight: 600; }
.knop:hover { border-color: var(--accent); }
.knop.primair { background: var(--accent); border-color: var(--accent); color: var(--vlak); }
.knop.klein { padding: 3px 8px; font-size: 13px; }
.knop:disabled { opacity: .5; cursor: default; }
.chip { display: inline-flex; align-items: center; gap: 4px; border-radius: 999px; padding: 1px 9px; font-size: 12.5px; font-weight: 600; border: 1px solid var(--lijn); white-space: nowrap; }
.chip.goed { color: var(--goed); border-color: currentColor; }
.chip.letop { color: var(--waarschuwing); border-color: currentColor; }
.chip.fout { color: var(--fout); border-color: currentColor; }
.chip.od { color: var(--vlak); border: 0; }
.od-HE { background: var(--HE); } .od-DE { background: var(--DE); } .od-HD { background: var(--HD); } .od-DD { background: var(--DD); } .od-GD { background: var(--GD); }
.melding { display: grid; grid-template-columns: 4px 1fr; gap: 10px; padding: 8px 0; border-top: 1px solid var(--lijn); }
.melding:first-child { border-top: 0; }
.melding::before { content: ""; border-radius: 2px; background: var(--zacht); }
.melding.probleem::before { background: var(--fout); }
.melding.let-op::before { background: var(--waarschuwing); }
.melding.info::before { background: var(--accent); }
.schema-box { overflow-x: auto; border: 1px solid var(--lijn); border-radius: 10px; background: var(--vlak); }
table.schema { border-collapse: separate; border-spacing: 0; width: 100%; min-width: 760px; }
table.schema th, table.schema td { border-bottom: 1px solid var(--lijn); padding: 5px; vertical-align: top; }
table.schema th { font-family: var(--display); font-weight: 600; font-size: 15px; text-align: left; background: var(--vlak); position: sticky; top: 0; }
table.schema td.tijd { font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; width: 58px; color: var(--zacht); position: sticky; left: 0; background: var(--vlak); }
table.schema tr.pauze td { background: var(--accent-zacht); color: var(--accent); font-weight: 600; text-align: center; }
.wed { border-left: 4px solid var(--zacht); background: var(--bg); border-radius: 6px; padding: 4px 7px; font-size: 13px; line-height: 1.3; }
.wed .titel { font-weight: 700; font-size: 12px; color: var(--zacht); display: flex; justify-content: space-between; gap: 6px; }
.wed .tegen { color: var(--zacht); font-size: 11.5px; }
.wed.dim { opacity: .28; }
.wed.licht { outline: 2px solid var(--accent); }
.wed.HE { border-left-color: var(--HE); } .wed.DE { border-left-color: var(--DE); } .wed.HD { border-left-color: var(--HD); } .wed.DD { border-left-color: var(--DD); } .wed.GD { border-left-color: var(--GD); }
.legenda { display: flex; flex-wrap: wrap; gap: 6px; }
.formgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px 16px; }
.veld label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 3px; }
.veld input, .veld select { width: 100%; padding: 6px 8px; border: 1px solid var(--lijn); border-radius: 6px; background: var(--vlak); }
.veld small { display: block; color: var(--zacht); font-size: 12.5px; margin-top: 3px; }
.tabel-box { overflow-x: auto; }
table.lijst { border-collapse: collapse; width: 100%; }
table.lijst th, table.lijst td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--lijn); vertical-align: middle; }
table.lijst th { font-size: 13px; color: var(--zacht); font-weight: 600; }
.niveaukeuze { display: inline-flex; border: 1px solid var(--lijn); border-radius: 7px; overflow: hidden; }
.niveaukeuze button { border: 0; background: var(--vlak); width: 30px; padding: 4px 0; cursor: pointer; font-weight: 600; border-left: 1px solid var(--lijn); }
.niveaukeuze button:first-child { border-left: 0; }
.niveaukeuze button[aria-pressed="true"] { background: var(--accent); color: var(--vlak); }
.klassen { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 10px; }
.klasse { border: 1px solid var(--lijn); border-radius: 8px; padding: 10px; background: var(--bg); }
.klasse h4 { margin: 0 0 6px; font-family: var(--display); font-size: 16px; font-weight: 600; display: flex; justify-content: space-between; }
.unit { display: flex; align-items: center; gap: 6px; padding: 4px 0; border-top: 1px solid var(--lijn); font-size: 14px; }
.unit:first-of-type { border-top: 0; }
.unit .naam { flex: 1; min-width: 0; }
.unit .pijl { border: 1px solid var(--lijn); background: var(--vlak); border-radius: 5px; width: 26px; height: 24px; cursor: pointer; padding: 0; }
.unit .pijl:disabled { opacity: .3; cursor: default; }
.voorstel { border: 1px solid var(--waarschuwing); background: var(--waarschuwing-zacht); border-radius: 8px; padding: 10px 12px; display: grid; gap: 8px; }
.speler-kaart { border: 1px solid var(--lijn); border-radius: 8px; padding: 10px 12px; background: var(--vlak); }
.speler-kaart ol { margin: 6px 0 0; padding-left: 20px; }
.spelers-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 10px; }
.status { font-size: 13px; }
.leeg { padding: 24px; text-align: center; color: var(--zacht); }
@media (max-width: 520px) { h1 { font-size: 21px; } .tegel { min-width: 0; flex: 1 1 30%; } }
@media (prefers-reduced-motion: no-preference) { .knop, nav.tabs button { transition: border-color .15s, color .15s; } }

[hidden] { display: none !important; }
.stapel { grid-template-columns: minmax(0, 1fr); }
.stapel > *, main > * { min-width: 0; }
.voorstel > div, .melding > div { overflow-wrap: anywhere; }
nav.stappen { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 10px; scrollbar-width: thin; }
nav.stappen button { flex: 0 0 auto; display: grid; grid-template-columns: 26px auto; grid-template-rows: auto auto; column-gap: 8px; align-items: center; text-align: left; border: 1px solid var(--lijn); background: var(--vlak); border-radius: 9px; padding: 7px 12px 7px 8px; cursor: pointer; min-width: 150px; }
nav.stappen button .nr { grid-row: 1 / span 2; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-family: var(--display); font-weight: 700; background: var(--bg); border: 1px solid var(--lijn); }
nav.stappen button .tt { font-weight: 700; font-size: 14px; white-space: nowrap; }
nav.stappen button .st { font-size: 12px; color: var(--zacht); white-space: nowrap; }
nav.stappen button.klaar .nr { background: var(--goed); border-color: var(--goed); color: var(--vlak); }
nav.stappen button.open .st { color: var(--waarschuwing); font-weight: 600; }
nav.stappen button[aria-current="step"] { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
nav.stappen button.extra { min-width: 0; grid-template-columns: auto; padding: 7px 12px; }
nav.stappen .scheiding { flex: 0 0 1px; background: var(--lijn); margin: 4px 4px; }
@media (min-width: 1000px) { nav.stappen { flex-wrap: wrap; overflow: visible; } }
.stapkop { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; align-items: flex-end; }
.stapkop p { margin: 4px 0 0; max-width: 70ch; }
.volgende { display: flex; justify-content: flex-end; gap: 8px; }
.mail { border: 1px solid var(--lijn); border-radius: 9px; padding: 12px; display: grid; gap: 8px; background: var(--vlak); }
.mail .kopregel { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 13.5px; }
.mail pre { margin: 0; white-space: pre-wrap; font: 13.5px/1.5 var(--tekst); background: var(--bg); border-radius: 7px; padding: 10px 12px; max-height: 280px; overflow: auto; }
.mail.verstuurd { opacity: .75; }
a.knop { text-decoration: none; display: inline-block; }
.veld textarea { width: 100%; min-height: 140px; padding: 8px; border: 1px solid var(--lijn); border-radius: 6px; background: var(--vlak); font: inherit; }
.mailrij { display: grid; grid-template-columns: minmax(140px, 1.2fr) minmax(160px, 1.4fr) auto; gap: 8px; align-items: center; padding: 8px 0; border-top: 1px solid var(--lijn); }
@media (max-width: 640px) { .mailrij { grid-template-columns: 1fr; } }
.spelerweergave { max-width: 640px; margin: 0 auto; display: grid; gap: 14px; }
.spelerweergave select { width: 100%; font-size: 18px; padding: 10px 12px; border: 1px solid var(--lijn); border-radius: 8px; background: var(--vlak); }
.wkaart { display: grid; grid-template-columns: 70px 1fr; gap: 12px; align-items: start; background: var(--vlak); border: 1px solid var(--lijn); border-left: 5px solid var(--zacht); border-radius: 10px; padding: 12px 14px; }
.wkaart .tijd { font-family: var(--display); font-size: 26px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
.wkaart .baan { font-size: 13px; color: var(--zacht); margin-top: 4px; }
.wkaart.HE { border-left-color: var(--HE); } .wkaart.DE { border-left-color: var(--DE); } .wkaart.HD { border-left-color: var(--HD); } .wkaart.DD { border-left-color: var(--DD); } .wkaart.GD { border-left-color: var(--GD); }
.afmeldknop { cursor: pointer; font: inherit; font-size: 12.5px; font-weight: 600; }
.chip.afmeldknop:not(.od) { background: var(--vlak); }
.afmeldknop.afgemeld { text-decoration: line-through; opacity: .45; }
.wed.vervallen { opacity: .45; text-decoration: line-through; }
.wkaart.vervallen { opacity: .55; }
.wkaart.vervallen .tijd { text-decoration: line-through; }
.koppel-kies { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.koppel-kies select { padding: 4px 6px; border: 1px solid var(--lijn); border-radius: 6px; background: var(--vlak); }
</style>
</head>
<body>
<header class="kop" id="kop">
  <div class="wrap">
    <div class="koprij">
      <h1 id="titel">Toernooiplanner clubkampioenschappen</h1>
      <div class="bron" id="bronbalk">
        <span id="bronTekst">Voorbeeldgegevens</span>
        <button class="knop klein" id="ophalen" type="button">Inschrijvingen ophalen uit Tally</button>
        <span id="opslag" class="status"></span>
      </div>
    </div>
    <div class="tegels" id="tegels"></div>
    <nav class="stappen" id="stappen" aria-label="Stappen"></nav>
  </div>
</header>
<main class="wrap" id="inhoud"></main>

<script>

</script>
