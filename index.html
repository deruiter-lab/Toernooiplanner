<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Toernooiplanner badminton (basis)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root {
  /* kleuren en letters van de Shuttle-school (Luck Raeck): marineblauw, koningsblauw en oranje */
  --bg: #eef3fb; --vlak: #ffffff; --inkt: #122544; --zacht: #5a6b88; --lijn: #cfdaec;
  --accent: #2b3bd8; --accent-zacht: #dbe6f8; --oranje: #f07f1a; --oranje-zacht: #fde8d4; --oranje-donker: #c45f08; --marine: #1d1d55;
  --goed: #1f8a4c; --goed-zacht: #d9f2e3; --waarschuwing: #c45f08; --fout: #c23b2b;
  --waarschuwing-zacht: #fde8d4; --fout-zacht: #fbe1dd;
  --HE: #2b3bd8; --DE: #c2337a; --HD: #1f8a8a; --DD: #7a4fc4; --GD: #f07f1a; --EM: #0f8fa8;
  --display: "Fredoka", "Baloo 2", "Trebuchet MS", system-ui, sans-serif;
  --tekst: "Atkinson Hyperlegible", Verdana, system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0c1730; --vlak: #14244a; --inkt: #eaf0fb; --zacht: #9fb0cf; --lijn: #2a3e6b;
    --accent: #9aa4ff; --accent-zacht: #1e3463; --oranje: #ff9a3d; --oranje-zacht: #4a2e14; --oranje-donker: #b35a0a;
    --goed: #5fd08f; --goed-zacht: #173d2a; --waarschuwing: #ffb06a; --fout: #ff7b6b;
    --waarschuwing-zacht: #4a2e14; --fout-zacht: #4a1f1a;
    --HE: #8f9cff; --DE: #f07fb4; --HD: #5cc6c6; --DD: #b693e0; --GD: #ff9a3d; --EM: #4cc3d9;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--inkt); font: 15px/1.45 var(--tekst); }
h1, h2, h3 { font-family: var(--display); font-weight: 700; margin: 0; letter-spacing: .01em; text-wrap: balance; }
h1 { font-size: 25px; } h2 { font-size: 21px; } h3 { font-size: 17px; }
button, select, input { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--oranje); outline-offset: 2px; }
[hidden] { display: none !important; }
.wrap { max-width: 1240px; margin: 0 auto; padding: 0 16px; }
header { background: #1d1d55 radial-gradient(140% 260% at 12% 0%, #3a48e0 0%, #2b3bd8 45%, #1d1d55 100%); color: #fff; padding-top: 12px; }
.merk { display: flex; align-items: center; gap: 12px; min-width: 0; }
.merk img { height: 38px; width: auto; display: block; }
.merk h1 { color: #ff9a3d; font-size: 24px; line-height: 1; white-space: nowrap; }
header .status { color: rgba(255,255,255,.75); }
header .extra button { background: rgba(255,255,255,.14); border-color: transparent; color: #fff; }
header .extra button:hover { background: rgba(255,255,255,.24); }
header .extra button[aria-current="page"] { background: #fff; color: var(--marine); border-color: #fff; }
header .tegel { background: rgba(255,255,255,.1); border-color: rgba(255,255,255,.18); color: #fff; }
header .tegel span { color: rgba(255,255,255,.8); }
header .tegel.probleem { background: rgba(194,59,43,.35); border-color: #ff7b6b; }
.koprij { display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: center; justify-content: space-between; }
.status { font-size: 13px; color: var(--zacht); }
.tegels { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0; }
.tegel { background: var(--bg); border: 1px solid var(--lijn); border-radius: 12px; padding: 6px 12px; min-width: 100px; }
.tegel b { display: block; font-family: var(--display); font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; }
.tegel span { font-size: 12.5px; color: var(--zacht); }
.vink { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; flex: none; border: 2px solid var(--lijn); color: var(--lijn); background: var(--bg); }
.vink svg { width: 20px; height: 20px; }
.stap-klaar .vink { background: var(--goed); border-color: var(--goed); color: #fff; }
.stapnr { display: block; font-size: 12px; color: var(--zacht); font-weight: 600; }
.staptitel { display: block; font-family: var(--display); font-size: 18px; font-weight: 700; line-height: 1.15; }
.stapstatus { display: block; font-size: 12.5px; color: var(--zacht); margin-top: 2px; }
.stap-klaar .stapstatus { color: var(--goed); font-weight: 600; }
.stap-let .stapstatus { color: var(--waarschuwing); font-weight: 600; }
.extra { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.extra button { border: 1px solid var(--lijn); background: var(--vlak); border-radius: 999px; padding: 4px 12px; cursor: pointer; font-weight: 600; font-size: 13.5px; color: var(--zacht); }
.extra button[aria-current="page"] { border-color: var(--accent); color: var(--accent); background: var(--accent-zacht); }
.stapbalk { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; justify-content: space-between; background: var(--vlak); border: 1px solid var(--lijn); border-left: 5px solid var(--oranje); border-radius: 16px; padding: 10px 14px; }
.stapbalk .staptitel { font-size: 17px; }
.stapbalk .stapstatus.ok { color: var(--goed); font-weight: 600; }
.voet { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: flex-end; }
.knop.groot { padding: 11px 22px; font-size: 18px; border-radius: 14px; }
.knop.primair.groot { background: var(--oranje); border-color: var(--oranje); color: #fff; box-shadow: 0 3px 0 var(--oranje-donker); }
.knop.primair.groot:disabled { box-shadow: none; }
.tegels.klein .tegel { padding: 4px 10px; } .tegels.klein .tegel b { font-size: 18px; }
nav.tabs button { border: 0; background: none; padding: 10px 14px; border-bottom: 3px solid transparent; cursor: pointer; white-space: nowrap; color: var(--zacht); font-weight: 600; }
nav.tabs button[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); }
main { padding: 18px 0 48px; display: grid; gap: 16px; }
main > * { min-width: 0; }
.paneel { background: var(--vlak); border: 1px solid var(--lijn); border-radius: 18px; padding: 16px; display: grid; gap: 12px; }
.paneel > * { min-width: 0; }
.rij { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; }
.zacht { color: var(--zacht); } .klein { font-size: 13px; }
p { margin: 0; max-width: 75ch; }
.knop { border: 2px solid var(--lijn); background: var(--vlak); border-radius: 12px; padding: 6px 14px; cursor: pointer; font-family: var(--display); font-weight: 600; font-size: 15.5px; }
.knop:hover:not(:disabled) { border-color: var(--accent); }
.knop.primair { background: var(--accent); border-color: var(--accent); color: var(--vlak); }
.knop.klein { padding: 3px 8px; font-size: 13px; }
.knop.gevaar { color: var(--fout); }
.knop:disabled { opacity: .45; cursor: default; }
input[type=text], input[type=number], input[type=time], select { padding: 6px 8px; border: 1px solid var(--lijn); border-radius: 6px; background: var(--vlak); }
.chip { display: inline-flex; align-items: center; gap: 4px; border-radius: 999px; padding: 1px 9px; font-size: 12.5px; font-weight: 600; border: 1px solid var(--lijn); white-space: nowrap; }
.chip.od { color: #fff; border: 0; }
.chip.goed { color: var(--goed); border-color: currentColor; }
.chip.letop { color: var(--waarschuwing); border-color: currentColor; }
.chip.fout { color: var(--fout); border-color: currentColor; }
.od-HE { background: var(--HE); } .od-DE { background: var(--DE); } .od-HD { background: var(--HD); } .od-DD { background: var(--DD); } .od-GD { background: var(--GD); } .od-EM { background: var(--EM); }
table.lijst { border-collapse: collapse; width: 100%; }
table.lijst th, table.lijst td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--lijn); vertical-align: middle; }
table.lijst th { font-size: 13px; color: var(--zacht); font-weight: 600; }
tr.afwezig td:not(:first-child) { opacity: .5; }
.naamveld { border: 1px solid transparent !important; background: transparent !important; width: 100%; min-width: 150px; padding: 4px 6px; }
.naamveld:hover, .naamveld:focus { border-color: var(--lijn) !important; background: var(--vlak) !important; }
textarea { width: 100%; padding: 8px; border: 1px solid var(--lijn); border-radius: 6px; background: var(--vlak); font: inherit; color: inherit; }
details > summary { cursor: pointer; font-weight: 600; font-size: 14px; }
.naamrij { display: flex; justify-content: space-between; align-items: center; gap: 6px; }
.naamrij.winst span { font-weight: 700; }
.wed .rust { font-size: 11px; color: var(--zacht); font-style: italic; }
.spkaart li.rustregel { color: var(--zacht); font-style: italic; }
input.score { width: 46px; padding: 1px 4px; font-size: 12.5px; text-align: center; }
.kaarten { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 10px; }
.spkaart { border: 1px solid var(--lijn); border-radius: 9px; padding: 10px 12px; background: var(--vlak); display: grid; gap: 6px; align-content: start; }
.spkaart ol { margin: 0; padding-left: 18px; display: grid; gap: 3px; font-size: 13.5px; }
.spkaart .tijd { font-weight: 700; font-variant-numeric: tabular-nums; }
table.stand td.num, table.stand th.num { text-align: right; font-variant-numeric: tabular-nums; }
.tabel-box { overflow-x: auto; }
.melding { border: 1px solid var(--waarschuwing); background: var(--waarschuwing-zacht); border-radius: 9px; padding: 10px 12px; display: grid; gap: 8px; }
.melding.fout { border-color: var(--fout); background: var(--fout-zacht); }
.melding.info { border-color: var(--accent); background: var(--accent-zacht); }
.onderdelen { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; }
.vormkeuze { display: grid; gap: 6px; padding: 8px 10px; background: var(--vlak); border: 1px solid var(--lijn); border-radius: 12px; }
.vormkeuze select { width: 100%; }
.od-kaart.od-klap { display: block; align-self: start; padding: 0; }
.od-klap > summary.od-kop { list-style: none; display: flex; align-items: center; gap: 10px; padding: 12px; cursor: pointer; border-radius: 16px; }
.od-klap > summary.od-kop::-webkit-details-marker { display: none; }
.od-klap > summary.od-kop:hover { background: var(--vlak); }
.od-klap > summary h3 { margin: 0; flex: 1 1 auto; min-width: 0; }
.od-samen { display: flex; flex-direction: column; align-items: flex-end; text-align: right; line-height: 1.25; }
.od-klap .pijl { flex: none; width: 10px; height: 10px; border-right: 2.5px solid var(--zacht); border-bottom: 2.5px solid var(--zacht); transform: rotate(45deg); margin: 0 4px 4px 2px; transition: transform .15s; }
.od-klap[open] .pijl { transform: rotate(-135deg); margin: 4px 4px 0 2px; }
.od-klap[open] > summary.od-kop { border-bottom: 1px solid var(--lijn); border-radius: 16px 16px 0 0; }
.od-inhoud { display: grid; gap: 8px; padding: 12px; }
.od-kaart.uit { opacity: .55; background: var(--vlak); border-style: dashed; }
.od-kaart.uit h3 { color: var(--zacht); }
.od-kaart { border: 1px solid var(--lijn); border-radius: 16px; padding: 12px; display: grid; gap: 8px; background: var(--bg); align-content: start; }
.deelnemer { display: flex; align-items: center; gap: 8px; padding: 4px 0; border-top: 1px solid var(--lijn); font-size: 14px; }
.deelnemer:first-of-type { border-top: 0; }
.deelnemer span { flex: 1; min-width: 0; }
.formgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 12px 16px; }
.veld label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 3px; }
.veld input, .veld select { width: 100%; }
.veld small { display: block; color: var(--zacht); font-size: 12.5px; margin-top: 3px; }
.schema-box { overflow-x: auto; border: 1px solid var(--lijn); border-radius: 10px; background: var(--vlak); }
table.schema { border-collapse: separate; border-spacing: 0; width: 100%; min-width: 720px; }
table.schema th, table.schema td { border-bottom: 1px solid var(--lijn); padding: 5px; vertical-align: top; }
table.schema th { font-family: var(--display); font-weight: 600; text-align: left; background: var(--vlak); }
tr.naeind td.tijd { color: var(--fout); }
tr.eindlijn td { border-top: 3px solid var(--fout); }
.tegel.probleem { border-color: var(--fout); background: var(--fout-zacht); }
table.schema td.tijd { font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; width: 58px; color: var(--zacht); position: sticky; left: 0; background: var(--vlak); }
td.tijd .tot { font-weight: 500; font-size: 11.5px; }
tr.wisselrij td { padding: 1px 8px; font-size: 11.5px; color: var(--zacht); background: repeating-linear-gradient(135deg, var(--bg) 0 6px, transparent 6px 12px); border-bottom: 1px solid var(--lijn); }
tr.wisselrij td.tijd { font-weight: 500; font-size: 11.5px; background: var(--vlak); }
tr.grens td { border-top: 3px solid var(--accent); }
tr.rustrij td { background: var(--accent-zacht); color: var(--accent); font-weight: 700; text-align: center; padding: 8px; font-family: var(--display); font-size: 16px; letter-spacing: .02em; }
tr.rustrij td.tijd { text-align: left; color: var(--accent); background: var(--accent-zacht); }
.veld.kort { max-width: 150px; }
.wed { border-left: 4px solid var(--zacht); background: var(--bg); border-radius: 6px; padding: 4px 7px; font-size: 13px; line-height: 1.3; }
.wed .titel { font-weight: 700; font-size: 12px; color: var(--zacht); display: flex; justify-content: space-between; gap: 6px; align-items: center; }
.wed .tegen { color: var(--zacht); font-size: 11.5px; }
.wed.HE { border-left-color: var(--HE); } .wed.DE { border-left-color: var(--DE); } .wed.HD { border-left-color: var(--HD); } .wed.DD { border-left-color: var(--DD); } .wed.GD { border-left-color: var(--GD); } .wed.EM { border-left-color: var(--EM); }
.wed.gespeeld { background: var(--accent-zacht); }
.wed.vervalt { opacity: .45; text-decoration: line-through; }
.wed.volgt { opacity: .75; border-style: dashed; }
.wed.dim { opacity: .25; } .wed.licht { outline: 2px solid var(--accent); }
.wed label { display: inline-flex; gap: 4px; align-items: center; font-weight: 600; font-size: 11.5px; cursor: pointer; }
.leeg { padding: 24px; text-align: center; color: var(--zacht); }
.afmeld { border: 1px solid var(--fout); border-radius: 10px; padding: 14px; display: grid; gap: 10px; background: var(--vlak); }
.afmeld .regel { display: grid; gap: 6px; padding: 8px 0; border-top: 1px solid var(--lijn); }
.radio { display: flex; gap: 6px; align-items: center; font-size: 14px; }
.rondes-mobiel { display: none; }
.rondes-lijst { display: grid; gap: 10px; max-width: 760px; }
.rondes-lijst input.score, .diagram input.score { width: 54px; padding: 4px; }
.diagram { display: flex; gap: 10px; overflow-x: auto; align-items: flex-start; padding-bottom: 10px; scroll-snap-type: x proximity; -webkit-overflow-scrolling: touch; }
.dblokken { display: grid; gap: 22px; }
.dblok { display: grid; gap: 8px; }
.dkop { display: flex; gap: 8px; align-items: center; font-family: var(--display); font-size: 17px; }
.dkol { flex: 0 0 270px; scroll-snap-align: start; }
.dkol.dlunch { flex: 0 0 auto; align-self: stretch; display: flex; } .dkol.dlunch .mrust { writing-mode: vertical-rl; transform: rotate(180deg); display: flex; align-items: center; justify-content: center; }
.dwed { display: grid; gap: 2px; }
.dwed .mbaan { padding-top: 0; }
input.score::-webkit-inner-spin-button, input.score::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
input.score { -moz-appearance: textfield; appearance: textfield; }
.schakel { display: inline-flex; border: 1px solid var(--lijn); border-radius: 999px; padding: 3px; background: var(--vlak); gap: 2px; }
.schakel button { border: 0; background: transparent; border-radius: 999px; padding: 7px 14px; font-weight: 600; font-size: 14px; cursor: pointer; color: var(--zacht); }
.schakel button[aria-pressed="true"] { background: var(--accent); color: #fff; }
.ronde { background: var(--vlak); border: 1px solid var(--lijn); border-radius: 10px; padding: 10px; display: grid; gap: 8px; }
.ronde.grens { border-top: 3px solid var(--accent); }
.rondekop { display: flex; justify-content: space-between; font-weight: 700; font-variant-numeric: tabular-nums; }
.rondekop.laat { color: var(--fout); }
.mwed { display: grid; grid-template-columns: 52px 1fr; gap: 8px; align-items: start; }
.mbaan { font-size: 12px; font-weight: 700; color: var(--zacht); padding-top: 6px; }
.mrust { text-align: center; background: var(--accent-zacht); color: var(--accent); font-weight: 700; border-radius: 10px; padding: 8px; }
input[type=checkbox] { width: 18px; height: 18px; accent-color: var(--accent); }
@media (min-width: 1100px) { .wrap { max-width: 1400px; } }
@media (max-width: 640px) {
  body { font-size: 15px; }
  .wrap { padding: 0 12px; }
  header { padding-top: 10px; }
  .merk img { height: 28px; } .merk h1 { font-size: 19px; } .merk { gap: 8px; }
  h2 { font-size: 19px; }
  .koprij { gap: 6px; }
  input, select, textarea { font-size: 16px; } /* voorkomt inzoomen op de iPhone */
  .tegels { gap: 6px; margin: 0 0 10px; }
  .tegel { min-width: 0; flex: 1 1 28%; padding: 4px 8px; }
  .tegel span { font-size: 11.5px; }
  main { padding: 12px 0 40px; gap: 12px; }
  .paneel { padding: 12px; }
  .stapbalk { padding: 10px 12px; }
  .stapbalk > button, .voet > button { width: 100%; }
  .voet { justify-content: stretch; }
  .knop.groot { font-size: 15.5px; padding: 12px 14px; }
  .knop.klein { padding: 6px 10px; }
  .rij > .veld, .rij > .veld.kort { flex: 1 1 calc(50% - 8px); max-width: none !important; min-width: 0 !important; }
  .onderdelen, .kaarten { grid-template-columns: 1fr; }
  .od-kaart select { flex: 1 1 140px; min-width: 0; }
  .schema-box { display: none; }
  .rondes-mobiel { display: grid; gap: 10px; }
  input.score { width: 54px; padding: 4px; }
  .wed { font-size: 14px; padding: 6px 8px; }
  .wed label { font-size: 12.5px; }
  /* spelerslijst als kaartjes */
  table.spelerslijst thead { display: none; }
  table.spelerslijst, table.spelerslijst tbody { display: block; }
  table.spelerslijst tr { display: grid; grid-template-columns: 30px 1fr auto; grid-template-areas: "v n s" ". o x"; gap: 4px 8px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--lijn); }
  table.spelerslijst td { border: 0; padding: 0; }
  table.spelerslijst td:nth-child(1) { grid-area: v; } table.spelerslijst td:nth-child(2) { grid-area: n; }
  table.spelerslijst td:nth-child(3) { grid-area: s; } table.spelerslijst td:nth-child(4) { grid-area: o; }
  table.spelerslijst td:nth-child(5) { grid-area: x; text-align: right; }
  table.spelerslijst td:nth-child(5):empty { display: none; }
  .naamveld { min-width: 0; }
  table.stand th, table.stand td { padding: 5px 4px; font-size: 13px; }
  #nieuweSpeler input[type=text] { flex: 1 1 100%; }
  #nieuweSpeler select, #nieuweSpeler button { flex: 1 1 40%; }
}
/* uitklapbare uitleg */
details.uitleg { font-size: 13.5px; color: var(--zacht); }
details.uitleg > summary { list-style: none; cursor: pointer; display: flex; gap: 8px; align-items: flex-start; font-weight: 400; font-size: 14px; color: var(--zacht); }
details.uitleg > summary::-webkit-details-marker { display: none; }
details.uitleg .vraag { flex: none; width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; background: var(--accent-zacht); color: var(--accent); font-family: var(--display); font-weight: 700; font-size: 13px; }
details.uitleg[open] .vraag { background: var(--accent); color: #fff; }
details.uitleg > div { margin: 8px 0 0 30px; max-width: 70ch; line-height: 1.5; }
/* niet mogelijke onderdelen als smalle regel */
.od-uit { display: grid; gap: 6px; margin-top: 4px; }
.od-regel { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; padding: 7px 12px; border: 1px dashed var(--lijn); border-radius: 12px; color: var(--zacht); font-size: 14px; }
.od-regel b { font-family: var(--display); font-weight: 600; color: var(--inkt); opacity: .7; }
.od-regel .chip.od { opacity: .6; }
/* nog niet ingedeeld */
.over { background: var(--oranje-zacht); border: 1px solid var(--oranje); border-radius: 12px; padding: 8px 12px; display: grid; gap: 8px; font-size: 14px; }
.over b { color: var(--oranje-donker); }
/* korte bevestigingen */
#toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 20px); opacity: 0; pointer-events: none; z-index: 50;
  background: var(--marine); color: #fff; padding: 10px 18px; border-radius: 14px; box-shadow: 0 6px 20px rgba(29,29,85,.3); font-weight: 600; max-width: calc(100vw - 32px); text-align: center; transition: opacity .2s, transform .2s; }
#toast.aan { opacity: 1; transform: translate(-50%, 0); }
#toast::before { content: "✓ "; color: #7fe0a8; }
@media (prefers-reduced-motion: reduce) { #toast { transition: none; } }
.opslag-ok { color: #7fe0a8 !important; }
label.alles { display: flex; align-items: center; gap: 10px; padding: 10px 8px; border-bottom: 2px solid var(--lijn); cursor: pointer; font-size: 15px; }
label.alles input { width: 20px; height: 20px; }
header p.waarschuwing { margin: 6px 0 0; color: #ffd0a1; font-weight: 600; font-size: 14.5px; max-width: none; }
/* stappen als tabbladen */
header { padding-bottom: 0; }
nav.stappen { display: flex; gap: 6px; align-items: flex-end; padding-top: 10px; }
nav.stappen button { flex: 1 1 0; min-width: 0; display: flex; gap: 10px; align-items: center; text-align: left; padding: 10px 14px 12px; min-height: 66px;
  border: 0; border-radius: 16px 16px 0 0; background: rgba(255,255,255,.13); color: #fff; cursor: pointer; position: relative; }
nav.stappen button:hover:not(:disabled):not([aria-current="step"]) { background: rgba(255,255,255,.22); }
nav.stappen button:disabled { cursor: not-allowed; opacity: .45; }
nav.stappen button .stapnr { color: rgba(255,255,255,.75); }
nav.stappen button .stapstatus { color: rgba(255,255,255,.85); }
nav.stappen button.stap-klaar .stapstatus { color: #9ef0c0; }
nav.stappen button.stap-let .stapstatus { color: #ffd0a1; }
nav.stappen button .vink { background: transparent; border-color: rgba(255,255,255,.55); color: rgba(255,255,255,.55); }
nav.stappen button.stap-klaar .vink { background: var(--goed); border-color: #fff; color: #fff; }
nav.stappen button[aria-current="step"] { background: var(--bg); color: var(--inkt); min-height: 74px; }
nav.stappen button[aria-current="step"]::before { content: ""; position: absolute; left: 14px; right: 14px; top: 0; height: 4px; border-radius: 0 0 4px 4px; background: var(--oranje); }
nav.stappen button[aria-current="step"] .stapnr { color: var(--zacht); }
nav.stappen button[aria-current="step"] .stapstatus { color: var(--zacht); }
nav.stappen button[aria-current="step"].stap-klaar .stapstatus { color: var(--goed); }
nav.stappen button[aria-current="step"].stap-let .stapstatus { color: var(--waarschuwing); }
nav.stappen button[aria-current="step"] .vink { border-color: var(--lijn); color: var(--lijn); }
nav.stappen button[aria-current="step"].stap-klaar .vink { border-color: var(--goed); color: #fff; }
main { padding-top: 10px; }
.voet.boven { justify-content: space-between; background: var(--vlak); border: 1px solid var(--lijn); border-radius: 16px; padding: 10px 14px; }
.voet.boven .klein { flex: 1 1 260px; }
.voet.boven.melding-ontbreekt { border-left: 5px solid var(--oranje); }
@media (max-width: 640px) {
  nav.stappen { gap: 4px; }
  nav.stappen button { flex-direction: column; justify-content: flex-start; text-align: center; gap: 4px; padding: 8px 4px 10px; min-height: 84px; border-radius: 12px 12px 0 0; }
  nav.stappen button[aria-current="step"] { min-height: 92px; }
  nav.stappen .vink { width: 24px; height: 24px; border-width: 2px; } nav.stappen .vink svg { width: 14px; height: 14px; }
  nav.stappen .stapnr { display: none; }
  nav.stappen .staptitel { font-size: 14px; overflow-wrap: anywhere; }
  nav.stappen .stapstatus { font-size: 10.5px; line-height: 1.2; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .voet.boven { padding: 10px; }
}
/* iPhone zoomt in bij invoervelden kleiner dan 16px: op telefoons en tablets daarom altijd minstens 16px */
@media (max-width: 640px), (pointer: coarse) { input, select, textarea { font-size: 16px !important; } }
.wed:has(input.score) { cursor: pointer; }
.pouleregel { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; background: var(--vlak); border: 1px solid var(--lijn); border-radius: 12px; padding: 8px 10px; font-size: 14px; }
.pouleregel.scheef, .iteller.scheef { border-color: var(--oranje); background: var(--oranje-zacht); }
.pk { display: inline-flex; gap: 3px; flex-wrap: wrap; }
.pk button { min-width: 34px; height: 32px; border: 1px solid var(--lijn); background: var(--bg); border-radius: 8px; font-weight: 700; font-size: 13px; cursor: pointer; color: var(--inkt); padding: 0 6px; }
.pk button.aan { background: var(--accent); border-color: var(--accent); color: #fff; }
.pk button.auto { border: 2px dashed var(--accent); color: var(--accent); }
.klein-pk button { min-width: 28px; height: 26px; font-size: 12px; }
.deelnemer .pk { margin-left: auto; }
.ikolommen { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 10px; }
.ikol { background: var(--vlak); border: 1px solid var(--lijn); border-radius: 14px; padding: 10px; display: grid; gap: 6px; align-content: start; }
.ikop { display: flex; justify-content: space-between; align-items: baseline; font-family: var(--display); }
.irij { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; justify-content: space-between; padding: 6px 0; border-top: 1px solid var(--lijn); }
.irij.is-auto .inaam { color: var(--zacht); font-style: italic; }
.inaam .sx { font-size: 11px; font-weight: 700; color: var(--zacht); border: 1px solid var(--lijn); border-radius: 6px; padding: 0 4px; margin-left: 4px; font-style: normal; }
.ilijst { display: none; }
.ivoet { position: sticky; bottom: 0; background: var(--bg); border-top: 1px solid var(--lijn); padding: 10px 0 4px; display: grid; gap: 8px; z-index: 5; }
.iteller { display: flex; flex-wrap: wrap; gap: 6px 14px; border: 1px solid var(--lijn); border-radius: 10px; padding: 6px 10px; font-variant-numeric: tabular-nums; }
.letop-blok { border-left: 5px solid var(--oranje); display: grid; gap: 6px; }
@media (max-width: 640px) { .ikolommen { display: none; } .ilijst { display: block; } .ivoet .rij > .knop { flex: 1 1 auto; } }
.venster { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; padding: 16px; }
.venster[hidden] { display: none; }
.venster-doek { position: absolute; inset: 0; background: rgba(20, 20, 60, .55); cursor: pointer; }
.venster-kader { position: relative; background: var(--bg); border-radius: 18px; padding: 20px; max-width: 440px; width: 100%; display: grid; gap: 10px; box-shadow: 0 20px 60px rgba(0,0,0,.35); }
.venster-kader h2 { margin: 0; } .venster-kader p { margin: 0; line-height: 1.5; }
body.venster-open { overflow: hidden; }
</style>

<script>
(() => {
const OD = {
  HE: { naam: 'Herenenkel', type: 'E', sexe: 'H' },
  DE: { naam: 'Damesenkel', type: 'E', sexe: 'D' },
  HD: { naam: 'Herendubbel', type: 'D', sexe: 'H' },
  DD: { naam: 'Damesdubbel', type: 'D', sexe: 'D' },
  GD: { naam: 'Gemengd dubbel', type: 'G' },
  EM: { naam: 'Enkel gemixed', type: 'E' }, // heren en dames door elkaar in enkelspel
};
// dubbelspel eerst; enkelspel komt bij de vereniging weinig voor en staat onderaan
const VOLGORDE = ['HD', 'DD', 'GD', 'HE', 'DE', 'EM'];
const STANDAARD = { banen: 6, start: '09:30', eind: '17:00', duur: 12, pauze: 3, maxAE: 2, maxPoule: 6, bijhouden: false, invallers: true, drietallen: true, poules: { HE: 1, DE: 1, HD: 1, DD: 1, GD: 1, EM: 1 }, vorm: {}, vormOpt: {}, rust: false, rustStart: '12:30', rustDuur: 30 };
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const kloon = o => JSON.parse(JSON.stringify(o));
const uid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const toMin = t => { const [h, m] = String(t).split(':').map(Number); return (h || 0) * 60 + (m || 0); };
const toTijd = m => `${String(Math.floor(m / 60)).padStart(2, '0')}:${String(m % 60).padStart(2, '0')}`;
const chip = d => `<span class="chip od od-${d}">${d}</span>`;

// ---------- toestand ----------
const leeg = () => ({ inst: kloon(STANDAARD), spelers: [], entries: {}, planning: null, stappen: {}, indeling: {} });
// Standaardlijst voor wie de planner voor het eerst opent. Wijzigingen worden daarna in de eigen browser bewaard.
const VOORBEELD = [
  ['Dave den Hartog', 'H'], ['Patrick Tukker', 'H'], ['Jos de Ruiter', 'H'], ['Mik Witte', 'H'], ['Trea van Galen', 'D'],
  ['Inger Goos', 'D'], ['Karien van der Wekken', 'D'], ['Ilona van Woudenberg', 'D'], ['Anja Broekhuizen', 'D'], ['Martine Clemens', 'D'],
  ['Rob den Hartog', 'H'], ['Perry Vergeer', 'H'], ['Marco van Galen', 'H'], ['Sylvian Tukker', 'H'], ['Marjo Roos', 'D'],
  ['speler 16', 'H'], ['speler 17', 'H'], ['speler 18', 'H'], ['speler 19', 'H'], ['speler 20', 'H'],
  ['speler 21', 'H'], ['speler 22', 'H'], ['speler 23', 'D'], ['speler 24', 'D'], ['speler 25', 'D'],
  ['speler 26', 'D'], ['speler 27', 'D'], ['speler 28', 'D']];
const voorbeeld = () => ({ ...leeg(), spelers: VOORBEELD.map(([n, sexe], i) => ({ id: 'v' + i + uid('').slice(-5), naam: n, sexe, afwezig: false })) });
let S = voorbeeld();
let allesVraag = null;
let tab = 'spelers', filterSpeler = '', afmeldId = null, bulkMelding = '', overzichtSpeler = '';

const speler = id => S.spelers.find(p => p.id === id);
const naam = id => (speler(id) || { naam: '?' }).naam;
const actieveEntries = d => Object.values(S.entries).filter(e => e.d === d && !e.weg && (typeof mogelijk !== 'function' || mogelijk(d).ok));
const entryNaam = e => e ? e.leden.map(naam).join(' / ') : '?';
const ander = s => (s === 'H' ? 'D' : 'H');
const alsTekst = s => (s === 'H' ? 'heer' : 'dame');
// spelers in een koppel die als het andere geslacht meespelen (alleen met de instelling "invallers")
function invallersIn(e) {

      <button class="knop" type="button" data-actie="indelen" ${vast ? 'disabled title="Er zijn al wedstrijden gespeeld"' : ''}>Poules opnieuw indelen</button></div></div>
    ${S.inst.bijhouden ? '<p class="klein zacht">Uitslagen vul je in bij de volgende stap, Uitslagen.</p>' : '<p class="klein zacht">Wil je uitslagen bijhouden? <button class="knop klein" type="button" data-actie="bijhoudenAan">Uitslagen bijhouden aanzetten</button></p>'}
    ${N < S.inst.banen && !instGewijzigd() ? `<p class="klein zacht">Er worden ${N} van de ${S.inst.banen} banen gebruikt. Meer wedstrijden tegelijk kan met deze deelnemers niet: elke wedstrijd vraagt twee koppels (bij enkel twee spelers) en niemand kan op twee banen tegelijk staan. Wil je meer banen vullen, laat dan meer onderdelen tegelijk spelen.</p>` : ''}
    ${tijdMelding()}
    <div>${poules}</div>
    <div class="rij"><div class="veld" style="min-width:220px"><label for="filter">Markeer speler</label><select id="filter"><option value="">Iedereen</option>${opties}</select></div></div></div>
    <div class="schema-box"><table class="schema"><thead><tr><th>Tijd</th>${Array.from({ length: N }, (_, i) => `<th>Baan ${i + 1}</th>`).join('')}</tr></thead><tbody>${rijen || `<tr><td colspan="${N + 1}" class="leeg">Geen wedstrijden te plannen.</td></tr>`}</tbody></table></div><div class="rondes-mobiel">${mobiel}</div>`;
}

// ---------- per speler ----------
function overzichtVan(pid) {
  if (!S.planning) return [];
  const rust = w => !w.gespeeld && (w.uit || []).includes(pid);
  return S.planning.wedstrijden.filter(w => !vervalt(w) && (spelersVan(w).includes(pid) || rust(w))).sort((a, b) => a.slot - b.slot).map(w => {
    const kant = rust(w) ? (S.entries[w.a].leden.includes(pid) ? 'a' : 'b') : zijde(w, 'a').includes(pid) ? 'a' : 'b', ander = kant === 'a' ? 'b' : 'a';
    if (rust(w)) return { tijd: toTijd(tijdVan(w.slot)), baan: w.baan + 1, d: w.d, label: w.label, rust: true, met: namenVan(w, kant), tegen: namenVan(w, ander) };
    const met = zijde(w, kant).filter(x => x !== pid).map(naam).join(' / ');
    let uitslag = '';
    if (w.score) { const [x, y] = kant === 'a' ? w.score : [w.score[1], w.score[0]]; uitslag = `${x}-${y} ${x > y ? 'gewonnen' : x < y ? 'verloren' : 'gelijk'}`; }
    return { tijd: toTijd(tijdVan(w.slot)), baan: w.baan + 1, d: w.d, label: w.label, met, tegen: namenVan(w, ander), uitslag };
  });
}
const regelTekst = x => x.rust ? `${x.tijd}  rust (${OD[x.d].naam}: ${x.met} spelen tegen ${x.tegen})` : `${x.tijd}  baan ${x.baan}  ${OD[x.d].naam}${x.label ? ' ' + x.label.replace('Poule ', 'poule ') : ''}${x.met ? ', met ' + x.met : ''}, tegen ${x.tegen}${x.uitslag ? ' (' + x.uitslag + ')' : ''}`;
const overzichtTekst = p => `${p.naam}\n` + overzichtVan(p.id).map(regelTekst).join('\n');
function spelersMetWedstrijden() { return S.spelers.filter(p => overzichtVan(p.id).length).sort((a, b) => a.naam.localeCompare(b.naam)); }
function rPerSpeler() {
  if (!S.planning) return '<div class="paneel"><h2>Per speler</h2><p class="leeg">Maak eerst een planning.</p></div>';
  const lijst = spelersMetWedstrijden(), toon = overzichtSpeler ? lijst.filter(p => p.id === overzichtSpeler) : lijst;
  const kaart = p => { const o = overzichtVan(p.id); return `<div class="spkaart"><div class="rij" style="justify-content:space-between"><h3>${esc(p.naam)}</h3><span class="klein zacht">${o.filter(x => !x.rust).length} wedstrijd${o.filter(x => !x.rust).length === 1 ? '' : 'en'}</span></div>
    <ol>${o.map(x => x.rust ? `<li class="rustregel"><span class="tijd">${x.tijd}</span> rust ${chip(x.d)} · ${esc(x.met)} spelen tegen ${esc(x.tegen)}</li>` : `<li><span class="tijd">${x.tijd}</span> baan ${x.baan} ${chip(x.d)}${x.label ? ' ' + esc(x.label) : ''}${x.met ? ` · met ${esc(x.met)}` : ''} · tegen ${esc(x.tegen)}${x.uitslag ? ` · <b>${esc(x.uitslag)}</b>` : ''}</li>`).join('')}</ol>
    <div class="rij"><button class="knop klein" type="button" data-actie="kopieer" data-id="${p.id}">Kopieer als tekst</button><span class="klein zacht" data-kopieerstatus="${p.id}"></span></div></div>`; };
  return `${banner()}<div class="paneel"><h2>Per speler</h2>
    ${uitleg('Per speler de tijden, banen en tegenstanders.', 'Gesorteerd op tijd. Om voor te lezen, of kopieer de tekst en stuur hem door.')}
    <div class="rij" style="align-items:flex-end"><div class="veld" style="min-width:240px"><label for="overzichtSpeler">Speler</label><select id="overzichtSpeler"><option value="">Alle spelers</option>${lijst.map(p => `<option value="${p.id}" ${overzichtSpeler === p.id ? 'selected' : ''}>${esc(p.naam)}</option>`).join('')}</select></div>
      <button class="knop" type="button" data-actie="kopieerAlles">Kopieer alles als tekst</button><span class="klein zacht" data-kopieerstatus="alles"></span></div></div>
    <div class="kaarten">${toon.map(kaart).join('') || '<p class="leeg">Geen wedstrijden.</p>'}</div>`;
}

// ---------- stand ----------
function rStand() {
  if (!S.planning) return '<div class="paneel"><h2>Stand</h2><p class="leeg">Maak eerst een planning.</p></div>';
  if (!S.inst.bijhouden) return `<div class="paneel"><h2>Stand</h2><p>Om een stand te zien, vul je bij de planning de uitslagen in.</p><div class="rij"><button class="knop primair" type="button" data-actie="bijhoudenAan">Uitslagen bijhouden aanzetten</button></div></div>`;
  const blok = (d, p, pi, aantal) => {
    const key = `${d}-${pi}`, W = S.planning.wedstrijden.filter(w => w.poule === key);
    const ids = [...new Set([...p, ...W.filter(w => w.score).flatMap(w => [w.a, w.b])])];
    const st = Object.fromEntries(ids.map(id => [id, { id, g: 0, w: 0, v: 0, pv: 0, pt: 0 }]));
    W.filter(w => w.score).forEach(w => { const [x, y] = w.score, A = st[w.a], B = st[w.b]; if (!A || !B) return;
      A.g++; B.g++; A.pv += x; A.pt += y; B.pv += y; B.pt += x; if (x > y) { A.w++; B.v++; } else if (y > x) { B.w++; A.v++; } });
    const rijen = Object.values(st).sort((a, b) => b.w - a.w || (b.pv - b.pt) - (a.pv - a.pt) || b.pv - a.pv);
    const totaal = W.filter(w => !vervalt(w)).length, klaar = W.filter(w => w.score).length;
    const nm = id => { const e = S.entries[id]; return e ? entryNaam(e) + (e.weg ? ' (afgemeld)' : '') : '?'; };
    const winnaar = totaal && klaar >= totaal && rijen.length ? `<span class="chip goed">Winnaar: ${esc(nm(rijen[0].id))}</span>` : '';
    return `<div class="od-kaart"><div class="rij" style="justify-content:space-between"><h3>${chip(d)} ${OD[d].naam}${aantal > 1 ? ' · poule ' + 'ABCDEFGH'[pi] : ''}</h3><span class="klein zacht">${klaar} van ${totaal} uitslagen</span></div>${winnaar}
      <div class="tabel-box"><table class="lijst stand"><thead><tr><th>#</th><th>${OD[d].type === 'E' ? 'Speler' : 'Koppel'}</th><th class="num" title="gespeeld">G</th><th class="num" title="gewonnen">W</th><th class="num" title="verloren">V</th><th class="num" title="punten voor en tegen">Punten</th><th class="num">Saldo</th></tr></thead>
      <tbody>${rijen.map((s, i) => `<tr><td>${i + 1}</td><td>${esc(nm(s.id))}</td><td class="num">${s.g}</td><td class="num">${s.w}</td><td class="num">${s.v}</td><td class="num">${s.pv}-${s.pt}</td><td class="num">${s.pv - s.pt > 0 ? '+' : ''}${s.pv - s.pt}</td></tr>`).join('')}</tbody></table></div></div>`;
  };
  const Wall = S.planning.wedstrijden, pvorm = d => (S.planning.vorm || {})[d] || 'poule';
  const nmE = id => { const e = S.entries[id]; return e ? entryNaam(e) + (e.weg ? ' (afgemeld)' : '') : '?'; };
  const kop = (d, extra) => `<div class="rij" style="justify-content:space-between"><h3>${chip(d)} ${OD[d].naam}</h3><span class="klein zacht">${extra}</span></div>`;
  // knock-out en finales: per ronde de uitslagen
  const koBlok = (d, poule, titel) => {
    const K = Wall.filter(w => w.d === d && w.poule === poule).sort((a, b) => a.ronde - b.ronde || a.label.localeCompare(b.label));
    if (!K.length) return '';
    const fin = K[K.length - 1], k = winnaarKant(fin);
    return `<div class="od-kaart">${kop(d, titel)}${k && fin[k] ? `<span class="chip goed">Winnaar: ${esc(nmE(fin[k]))}</span>` : ''}
      <div>${K.map(w => `<div class="deelnemer"><span><b class="klein">${esc(w.label)}</b><br>${esc(namenVan(w, 'a'))} – ${esc(namenVan(w, 'b'))}</span><span class="num">${w.score ? w.score.join('-') : w.wo ? 'w.o.' : w.leeg ? '–' : ''}</span></div>`).join('')}</div></div>`;
  };
  const html = VOLGORDE.map(d => {
    const v = pvorm(d);
    if (!Wall.some(w => w.d === d)) return '';
    if (v === 'poule') return (S.planning.poules[d] || []).map((p, pi, all) => blok(d, p, pi, all.length)).join('');
    if (v === 'poulefinale') { const pl = S.planning.poules[d] || [];
      return pl.map((p, pi, all) => blok(d, p, pi, all.length)).join('') + koBlok(d, `${d}-fin`, 'Finales') + pl.map((_, pi) => koBlok(d, `${d}-fin${pi}`, `Finale poule ${LETTERS[pi]}`)).join(''); }
    if (v === 'knockout') return koBlok(d, `${d}-ko`, 'Knock-out') + koBlok(d, `${d}-troost`, 'Troostronde');
    if (v === 'wisselend') { // ranglijst per speler
      const st = {}; Wall.filter(w => w.d === d && w.score).forEach(w => { const za = w.zijden ? w.zijden.a : w.ka, zb = w.zijden ? w.zijden.b : w.kb, [x, y] = w.score;
        [[za, x, y], [zb, y, x]].forEach(([z, v1, v2]) => z.forEach(p => { const s = st[p] = st[p] || { p, g: 0, w: 0, pv: 0, pt: 0 }; s.g++; s.pv += v1; s.pt += v2; if (v1 > v2) s.w++; })); });
      const rij = Object.values(st).sort((a, b) => b.pv - a.pv || b.w - a.w || (b.pv - b.pt) - (a.pv - a.pt));
      const W2 = Wall.filter(w => w.d === d && !vervalt(w)), klaar = W2.length && W2.every(w => w.gespeeld);
      return `<div class="od-kaart">${kop(d, `Wisselende partners · ${W2.filter(w => w.gespeeld).length} van ${W2.length} uitslagen`)}${klaar && rij.length ? `<span class="chip goed">Winnaar: ${esc(naam(rij[0].p))}</span>` : ''}
        <div class="tabel-box"><table class="lijst stand"><thead><tr><th>#</th><th>Speler</th><th class="num">G</th><th class="num">W</th><th class="num" title="gescoorde punten">Punten</th><th class="num">Saldo</th></tr></thead>
        <tbody>${rij.map((s, i) => `<tr><td>${i + 1}</td><td>${esc(naam(s.p))}</td><td class="num">${s.g}</td><td class="num">${s.w}</td><td class="num">${s.pv}</td><td class="num">${s.pv - s.pt > 0 ? '+' : ''}${s.pv - s.pt}</td></tr>`).join('') || '<tr><td colspan="6" class="zacht">Nog geen uitslagen.</td></tr>'}</tbody></table></div><p class="klein zacht">Volgorde: meeste gescoorde punten, dan meeste gewonnen wedstrijden.</p></div>`;
    }
    const R = Wall.filter(w => w.d === d && w.fase === 'ronde'), rmax = R.length ? Math.max(...R.map(w => w.rondeNr)) : 0;
    const klaarR = R.filter(w => !w.leeg).every(w => w.gespeeld);
    if (v === 'zwitsers') {
      const stand = zwitsersStand(d, Wall, rmax + 1);
      return `<div class="od-kaart">${kop(d, `Zwitsers · ${R.filter(w => w.gespeeld).length} van ${R.filter(w => !w.leeg).length} uitslagen`)}${klaarR ? `<span class="chip goed">Winnaar: ${esc(nmE(stand[0].id))}</span>` : ''}
        <div class="tabel-box"><table class="lijst stand"><thead><tr><th>#</th><th>${OD[d].type === 'E' ? 'Speler' : 'Koppel'}</th><th class="num">W</th><th class="num">Punten</th><th class="num">Saldo</th></tr></thead>
        <tbody>${stand.map((s, i) => `<tr><td>${i + 1}</td><td>${esc(nmE(s.id))}</td><td class="num">${s.w}</td><td class="num">${s.pv}-${s.pt}</td><td class="num">${s.pv - s.pt > 0 ? '+' : ''}${s.pv - s.pt}</td></tr>`).join('')}</tbody></table></div><p class="klein zacht">Een ronde vrij telt als gewonnen.</p></div>`;
    }
    // koning van de baan: volgorde na de laatst gespeelde ronde
    let laatste = -1; for (let r = 0; r <= rmax; r++) if (R.filter(w => w.rondeNr === r && !w.leeg).every(w => w.gespeeld && winnaarKant(w)) && R.some(w => w.rondeNr === r && w.gespeeld)) laatste = r;
    const orde = laatste < 0 ? [] : R.filter(w => w.rondeNr === laatste && !w.leeg).sort((a, b) => a.baanPos - b.baanPos).flatMap(w => { const k = winnaarKant(w); return [w[k], w[k === 'a' ? 'b' : 'a']]; });
    return `<div class="od-kaart">${kop(d, `Koning van de baan · ${laatste < 0 ? 'nog geen ronde gespeeld' : `na ronde ${laatste + 1} van ${rmax + 1}`}`)}${klaarR && orde.length ? `<span class="chip goed">Koning van de baan: ${esc(nmE(orde[0]))}</span>` : ''}
      <ol>${orde.map((id, i) => `<li>${esc(nmE(id))} <span class="klein zacht">${i < 2 ? '· koningsbaan' : '· baan ' + (Math.floor(i / 2) + 1)}</span></li>`).join('') || '<li class="zacht">Nog geen uitslagen.</li>'}</ol></div>`;
  }).join('');
  const Wg = S.planning.wedstrijden.filter(x => !vervalt(x)), ng = Wg.filter(x => x.gespeeld).length, alles = Wg.length > 0 && ng >= Wg.length;
  return `<div class="paneel"><div class="rij" style="justify-content:space-between"><h2>${alles ? 'Eindstand' : 'Tussenstand'}</h2><span class="chip ${alles ? 'goed' : ''}">${ng} van ${Wg.length} gespeeld</span></div>
    ${alles ? '' : '<p class="klein zacht" style="margin:0">Op basis van de uitslagen die tot nu toe zijn ingevuld.</p>'}
    ${alles ? '' : '<div class="rij"><button class="knop klein" type="button" data-tab="spelen">← Verder met uitslagen</button></div>'}${uitleg('De stand per onderdeel.', 'Volgorde: eerst het aantal gewonnen wedstrijden, dan het puntensaldo, dan het aantal gescoorde punten. Uitslagen vul je in bij de stap Uitslagen.')}</div>
    <div class="onderdelen">${html || '<p class="leeg">Geen poules.</p>'}</div>`;
}

function rInstellingen() {
  const i = S.inst;
  const num = (k, min, max, label, hulp) => `<div class="veld"><label for="i-${k}">${label}</label><input id="i-${k}" type="number" min="${min}" ${max !== '' ? `max="${max}"` : ''} value="${i[k]}" data-inst="${k}">${hulp ? `<small>${hulp}</small>` : ''}</div>`;
  return `<div class="paneel"><h2>Instellingen</h2><div class="formgrid">
    ${num('banen', 1, '', 'Aantal banen')}
    <div class="veld"><label for="i-start">Begintijd</label><input id="i-start" type="time" value="${esc(i.start)}" data-inst="start"></div>
    <div class="veld"><label for="i-eind">Eindtijd</label><input id="i-eind" type="time" value="${esc(i.eind)}" data-inst="eind"><small>Uiterlijk klaar. Past de planning niet, dan zegt de tool wat helpt.</small></div>
    ${num('duur', 4, 40, 'Wedstrijdduur (minuten)')}
    ${num('pauze', 0, 30, 'Pauze tussen wedstrijden (minuten)', 'De tijd tussen het einde van een ronde en het begin van de volgende.')}
    <div class="veld"><label for="i-rust">Lunchpauze</label><select id="i-rust" data-inst="rust" data-bool="1"><option value="0" ${i.rust ? '' : 'selected'}>Geen lunchpauze</option><option value="1" ${i.rust ? 'selected' : ''}>Wel een lunchpauze</option></select><small>Voor een toernooi van een hele dag.</small></div>
    <div class="veld"><label for="i-rustStart">Lunchpauze vanaf</label><input id="i-rustStart" type="time" value="${esc(i.rustStart)}" data-inst="rustStart" ${i.rust ? '' : 'disabled'}></div>
    ${num('rustDuur', 5, 240, 'Duur lunchpauze (minuten)')}
    ${num('maxAE', 1, 6, 'Maximaal achter elkaar spelen')}
    ${num('maxPoule', 2, 12, 'Maximale poulegrootte bij automatisch', 'Alleen voor onderdelen waar bij Onderdelen "Automatisch" is gekozen. Standaard speelt elk onderdeel in één poule.')}
    <div class="veld"><label for="i-drietallen">Drietallen</label><select id="i-drietallen" data-inst="drietallen" data-bool="1"><option value="1" ${i.drietallen ? 'selected' : ''}>Overblijver sluit aan als derde</option><option value="0" ${i.drietallen ? '' : 'selected'}>Niet gebruiken</option></select><small>Een speler die overblijft, vormt een drietal met een koppel. Per wedstrijd spelen er twee; de tool laat om de beurt iemand rusten.</small></div>
    <div class="veld"><label for="i-invallers">Spelen als ander geslacht</label><select id="i-invallers" data-inst="invallers" data-bool="1"><option value="1" ${i.invallers ? 'selected' : ''}>Toestaan om koppels compleet te maken</option><option value="0" ${i.invallers ? '' : 'selected'}>Niet toestaan</option></select><small>Bijvoorbeeld een heer die als dame meespeelt in damesdubbel of gemengd dubbel, zodat er niemand overblijft.</small></div>
  </div>
  <label class="rij" style="gap:8px;font-weight:600"><input type="checkbox" data-inst="bijhouden" ${i.bijhouden ? 'checked' : ''}> Uitslagen bijhouden</label>
  <p class="klein zacht">Gespeelde wedstrijden blijven bij opnieuw plannen op hun plek staan. Instellingen gelden pas na Opnieuw plannen.</p>
  <div class="rij"><button class="knop klein" type="button" data-actie="voorbeeld">Standaardlijst spelers terugzetten</button><button class="knop gevaar" type="button" data-actie="wis">Alles wissen</button><span class="klein zacht" id="wisTekst"></span></div></div>`;
}

// ---------- interactie ----------
document.addEventListener('click', e => {
  if (e.target.closest('.venster-doek')) { sluitVraag(); return; }
  const t = e.target.closest('button'); if (!t) return;
  const id = t.dataset.id;
  if (t.dataset.indeel) { const d = indeelD, pid = t.dataset.indeel; if (!d) return; S.indeling[d] = S.indeling[d] || {};
    if (t.dataset.p === '') delete S.indeling[d][pid]; else S.indeling[d][pid] = Number(t.dataset.p); wijzig(); return; }
  if (t.dataset.weergave) { weergave = t.dataset.weergave; try { localStorage.setItem('tp-weergave', weergave); } catch (x) {} render(); return; }
  if (t.dataset.tab) { indeelD = null; tab = t.dataset.tab; afmeldId = null; render(); window.scrollTo(0, 0); return; }
  switch (t.dataset.actie) {
    case 'plan': {
      maakPlanning(false); tab = 'planning'; render();
      const w = S.planning ? S.planning.wedstrijden.filter(x => !vervalt(x)) : [];
      if (w.length) toast(`Planning gemaakt: ${w.length} wedstrijden in ${new Set(w.map(x => x.slot)).size} ronden, klaar om ${toTijd(eindeMin())}`);
      break;
    }
    case 'indelen': maakPlanning(true); toast('Poules opnieuw ingedeeld'); break;
    case 'afmelden': afmeldId = id; render(); window.scrollTo(0, 0); break;
    case 'afmeldOk': bevestigAfmelden(); break;
    case 'afmeldAnnuleer': afmeldId = null; render(); break;
    case 'allesUitOk':
      Object.values(S.entries).filter(e => !e.weg).forEach(e => { if (inGebruik(e.id)) e.weg = true; else delete S.entries[e.id]; });
      S.spelers.forEach(p => { p.afwezig = true; }); allesVraag = null; afmeldId = null; wijzig(); toast('Iedereen op afwezig gezet'); break;
    case 'allesUitNee': allesVraag = null; render(); break;
    case 'alleAanwezig': S.spelers.forEach(p => { p.afwezig = false; }); wijzig(); toast(`Iedereen aanwezig (${S.spelers.length})`); break;
    case 'nieuw':
      vraag({ titel: 'Nieuw toernooi beginnen?', tekst: 'De planning, de inschrijvingen, de poule-indeling en alle uitslagen worden gewist. De spelerslijst blijft bewaard; daarna vink je aan wie er is.', ja: 'Ja, nieuw toernooi', nee: 'Annuleren', gevaar: true, actie: 'nieuwOk' });
      break;
    case 'vraagNee': sluitVraag(); break;
    case 'nieuwOk':
      sluitVraag();
      { S.entries = {}; S.indeling = {}; indeelD = null; S.planning = null; S.stappen = {}; S.spelers.forEach(p => { p.afwezig = true; }); afmeldId = null; filterSpeler = ''; overzichtSpeler = ''; tab = 'spelers'; wijzig(); window.scrollTo(0, 0); toast('Nieuw toernooi: vink aan wie er is'); }
      break;
    case 'bulk': {
      const regels = ($('#bulk').value || '').split(/\r?\n/).map(s => s.trim()).filter(Boolean);
      let nieuw = 0, terug = 0;
      regels.forEach(rg => {
        const { naam: n, sexe } = leesNaam(rg.replace(/^[-•*\d.)\s]+/, ''), $('#bulkSexe').value); if (!n) return;
        const bestaand = S.spelers.find(p => p.naam.toLowerCase() === n.toLowerCase());
        if (bestaand) { if (bestaand.afwezig) { bestaand.afwezig = false; terug++; } return; }
        S.spelers.push({ id: uid('s'), naam: n, sexe }); nieuw++;
      });
      bulkMelding = `${nieuw} speler${nieuw === 1 ? '' : 's'} toegevoegd${terug ? `, ${terug} op aanwezig gezet` : ''}.`;
      wijzig(); toast(bulkMelding.replace(/\.$/, '')); break;
    }
    case 'trio': {
      const d = t.dataset.d, sp = $(`#trioSp-${d}`).value, k = S.entries[$(`#trioK-${d}`).value];
      if (k && speler(sp) && k.leden.length === 2) { k.leden.push(sp); wijzig(); }
      break;
    }
    case 'bijhoudenAan': S.inst.bijhouden = true; wijzig(); break;
    case 'kopieer': case 'kopieerAlles': {
      const p = speler(id), tekst = p ? overzichtTekst(p) : spelersMetWedstrijden().map(overzichtTekst).join('\n\n');
      const st = document.querySelector(`[data-kopieerstatus="${p ? id : 'alles'}"]`);
      const fout = () => { if (st) st.textContent = 'Kopiëren lukte niet in deze weergave'; };
      try { navigator.clipboard.writeText(tekst).then(() => { if (st) st.textContent = 'Gekopieerd'; }, fout); } catch (x) { fout(); }
      break;
    }
    case 'verwijder': { const p = speler(id); S.spelers = S.spelers.filter(x => x.id !== id); wijzig(); if (p) toast(`${p.naam} verwijderd`); break; }
    case 'inschrijven': inschrijven(t.dataset.d); break;
    case 'alleE': { const l = vrijVoor(t.dataset.d, OD[t.dataset.d].sexe); l.forEach(p => nieuweEntry(t.dataset.d, [p.id])); wijzig(); toast(`${l.length} speler${l.length === 1 ? '' : 's'} toegevoegd aan ${OD[t.dataset.d].naam.toLowerCase()}`); break; }
    case 'indeelOpen': indeelD = t.dataset.d; render(); window.scrollTo(0, 0); break;
    case 'indeelSluit': indeelD = null; render(); window.scrollTo(0, 0); break;
    case 'indeelAuto': if (S.indeling) delete S.indeling[t.dataset.d]; wijzig(); break;
    case 'indeelVerplaats': { const d = t.dataset.d, i = t.dataset.k, pid = ($(`#iv-sp-${i}`) || {}).value, naar = Number(($(`#iv-p-${i}`) || {}).value);
      if (!pid || !Number.isFinite(naar)) break;
      // eerst de huidige (ook automatische) indeling vastleggen, anders schuift de automatische verdeling het meteen weer terug
      S.indeling[d] = S.indeling[d] || {}; indelingPlan(d).toew.forEach((v, x) => { S.indeling[d][x] = v; }); S.indeling[d][pid] = naar; wijzig(); toast(`${naam(pid)} naar poule ${LETTERS[naar]}`); break; }
    case 'indeelKlaar': { const d = t.dataset.d; indeelKlaar(d); indeelD = null; wijzig(); window.scrollTo(0, 0);
      toast(OD[d].type === 'E' ? 'Indeling toegepast' : `${actieveEntries(d).length} koppels samengesteld in ${pouleKeuze(d)} poules`); break; }
    case 'koppelPoule': { const e = S.entries[id]; if (!e) break; if (t.dataset.p === '') delete e.poule; else e.poule = Number(t.dataset.p); wijzig(); break; }
    case 'samenstellen': case 'hussel': {
      const d = t.dataset.d, voor = actieveEntries(d).length;
      if (t.dataset.actie === 'hussel') hussel(d); else samenstellen(d);
      wijzig(); const n = actieveEntries(d).length;
      toast(t.dataset.actie === 'hussel' ? `Opnieuw gehusseld: ${n} koppels` : `${n - voor} koppel${n - voor === 1 ? '' : 's'} samengesteld voor ${OD[d].naam.toLowerCase()}`);
      break;
    }
    case 'uitschrijven': {
      const en = S.entries[id]; if (!en) break;
      if (S.planning && S.planning.wedstrijden.some(w => w.a === id || w.b === id)) en.weg = true; else delete S.entries[id];
      wijzig(); break;
    }
    case 'voorbeeld':
      if (t.dataset.zeker) { S = voorbeeld(); afmeldId = null; filterSpeler = ''; overzichtSpeler = ''; tab = 'spelers'; wijzig(); window.scrollTo(0, 0); toast(`Standaardlijst met ${VOORBEELD.length} spelers teruggezet`); }
      else { t.dataset.zeker = '1'; t.textContent = 'Klik nogmaals: alles vervangen door de standaardlijst'; }
      break;
    case 'wis':
      if (t.dataset.zeker) { S = leeg(); S.stappen = {}; afmeldId = null; tab = 'spelers'; wijzig(); }
      else { t.dataset.zeker = '1'; t.textContent = 'Klik nogmaals om alles te wissen'; }
      break;
  }
});
// naam met ,h of ,d erachter (ook met spatie na de komma, hoofd- of kleine letter), bijvoorbeeld "Jan de Vries, h" of "Petra Bakker,D"
function leesNaam(tekst, standaard) {
  let n = String(tekst || '').trim(), sexe = standaard, gevonden = false;
  const m = n.match(/^(.*?)\s*,\s?([hd])$/i);
  if (m && m[1].trim()) { n = m[1]; sexe = m[2].toUpperCase(); gevonden = true; }
  return { naam: n.trim(), sexe, gevonden };
}
// het keuzeveld onthoudt de laatste keuze; ,h of ,d achter de naam zet het meteen om
let laatsteSexe = 'H';
document.addEventListener('input', e => {
  if (e.target.id !== 'spNaam') return;
  const r = leesNaam(e.target.value, null); if (r.gevonden && $('#spSexe')) { $('#spSexe').value = r.sexe; laatsteSexe = r.sexe; }
});
document.addEventListener('submit', e => {
  if (e.target.id !== 'nieuweSpeler') return;
  e.preventDefault();
  const sexe = $('#spSexe').value, r = leesNaam($('#spNaam').value, sexe), n = r.naam; if (!n) return;
  S.spelers.push({ id: uid('s'), naam: n, sexe: r.sexe });
  wijzig(); toast(`${n} toegevoegd als ${r.sexe === 'H' ? 'heer' : 'dame'}`); const el = $('#spNaam'); if (el) { el.focus(); $('#spSexe').value = sexe; }
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.id === 'filter') { filterSpeler = el.value; render(); return; }
  if (el.id === 'spSexe') { laatsteSexe = el.value; return; }
  if (el.dataset.vorm) {
    const d = el.dataset.vorm, oud = vormVan(d), nieuw = el.value; if (oud === nieuw) return;
    S.inst.vorm[d] = nieuw;
    // wisselende partners: inschrijving per speler in plaats van per koppel
    if ((oud === 'wisselend') !== (nieuw === 'wisselend') && OD[d].type !== 'E') {
      const ins = Object.values(S.entries).filter(e => e.d === d && !e.weg), spelers = [...new Set(ins.flatMap(e => e.leden))];
      ins.forEach(e => { if (inGebruik(e.id)) e.weg = true; else delete S.entries[e.id]; });
      if (nieuw === 'wisselend') spelers.forEach(p => nieuweEntry(d, [p]));
      toast(nieuw === 'wisselend' ? `${spelers.length} spelers ingeschreven voor wisselende partners` : 'Stel de koppels opnieuw samen');
    } else toast(`${OD[d].naam}: ${VORMEN[nieuw].naam.toLowerCase()}`);
    wijzig(); return;
  }
  if (el.dataset.vopt) {
    const d = el.dataset.vopt, k = el.dataset.optnaam; S.inst.vormOpt[d] = { ...(S.inst.vormOpt[d] || {}) };
    S.inst.vormOpt[d][k] = el.type === 'checkbox' ? el.checked : k === 'finaleWijze' ? el.value : k === 'rondes' ? Math.max(1, Math.min(30, Math.round(Number(el.value) || 1))) : Number(el.value);
    wijzig(); return;
  }
  if (el.dataset.poules) { S.inst.poules[el.dataset.poules] = el.value === 'auto' ? 'auto' : Number(el.value); wijzig(); return; }
  if (el.id === 'overzichtSpeler') { overzichtSpeler = el.value; render(); return; }
  if (el.dataset.naam) { const p = speler(el.dataset.naam), n = el.value.trim(); if (p && n) p.naam = n; wijzig(); return; }
  if (el.dataset.alles) {
    if (el.checked) { S.spelers.forEach(p => { p.afwezig = false; }); allesVraag = null; afmeldId = null; wijzig(); toast(`Iedereen aanwezig (${S.spelers.length})`); return; }
    // iedereen afwezig: als er al inschrijvingen zijn, eerst vragen
    const ins = Object.values(S.entries).filter(e => !e.weg);
    if (ins.length) { allesVraag = { n: ins.length }; render(); return; }
    S.spelers.forEach(p => { p.afwezig = true; }); wijzig(); toast('Iedereen op afwezig gezet'); return;
  }
  if (el.dataset.aanwezig) {
    const p = speler(el.dataset.aanwezig); if (!p) return;
    if (el.checked) { p.afwezig = false; afmeldId = null; wijzig(); return; }
    if (Object.values(S.entries).some(e => !e.weg && e.leden.includes(p.id))) { afmeldId = p.id; render(); window.scrollTo(0, 0); return; }
    p.afwezig = true; wijzig(); return;
  }
  if (el.dataset.score) {
    const w = S.planning && S.planning.wedstrijden.find(x => x.id === el.dataset.score); if (!w) return;
    const had = !!w.score;
    w['s' + el.dataset.kant] = el.value === '' ? null : Math.max(0, Math.round(Number(el.value)));
    if (w.sa != null && w.sb != null) {
      w.score = [w.sa, w.sb]; w.gespeeld = true; toast(`Uitslag ${w.sa}-${w.sb} opgeslagen`);
      snapshot(w);
      bewaar(); setTimeout(render, 0); return; // na het verplaatsen van de cursor tekenen, zodat die in het nieuwe vak blijft
    }
    if (had) { delete w.score; w.gespeeld = false; delete w.namen; delete w.zijden; bewaar(); setTimeout(render, 0); } else bewaar();
    return;
  }
  if (el.dataset.sexe) {
    const p = speler(el.dataset.sexe); if (!p || p.sexe === el.value) return;
    p.sexe = el.value;
    // inschrijvingen die niet meer kloppen (bijv. damesenkel voor een heer) vervallen
    Object.values(S.entries).filter(en => !en.weg && en.leden.includes(p.id)).forEach(en => {
      const od = OD[en.d];
      const klopt = (od.type === 'E' && !od.sexe) || (S.inst.invallers && od.type !== 'E') || (od.type === 'G' ? new Set(en.leden.map(id => speler(id).sexe)).size === 2 : en.leden.every(id => speler(id).sexe === od.sexe));
      if (!klopt) { if (inGebruik(en.id)) en.weg = true; else delete S.entries[en.id]; }
    });
    wijzig(); return;
  }
  if (el.dataset.gespeeld) {
    const w = S.planning.wedstrijden.find(x => x.id === el.dataset.gespeeld); if (!w) return;
    w.gespeeld = el.checked;
    if (w.gespeeld) snapshot(w);
    else { delete w.namen; delete w.zijden; delete w.score; w.sa = null; w.sb = null; }
    wijzig(); return;
  }
  if (el.dataset.inst) {
    const k = el.dataset.inst;
    let v = el.type === 'checkbox' ? el.checked : el.dataset.bool ? el.value === '1' : el.type === 'number' ? Number(el.value) : el.value;
    if (el.type === 'number') { if (!Number.isFinite(v)) return; v = Math.max(Number(el.min), Math.round(v)); if (el.max !== '') v = Math.min(Number(el.max), v); }
    S.inst[k] = v;
    // Tijdkiezer: niet opnieuw tekenen terwijl de kiezer open staat, anders sluit hij meteen. Pas bijwerken bij verlaten van het veld.
    if (el.type === 'time') { bewaar(); el.dataset.gewijzigd = '1'; return; }
    wijzig();
  }
});
document.addEventListener('focusout', e => {
  const el = e.target;
  if (el && el.type === 'time' && el.dataset.gewijzigd) { delete el.dataset.gewijzigd; laatsteDoel = el; render(); }
});

// ---------- start ----------
try { laad(JSON.parse(localStorage.getItem('basis-toernooiplanner') || 'null')); } catch (e) {}
render();
zetStatus(OPSLAG_LOKAAL, true);
(async () => {
  try {
    db = await claude.use('db');
    if (!db) return;
    const t = setTimeout(() => zetStatus('Opslag nog niet bereikbaar'), 10000);
    try {
      const snap = await db.doc(DOC).get(); clearTimeout(t);
      if (snap.exists) laad(snap.data());
      zetStatus(OPSLAG_ONLINE, true); render();
    } catch (e) { clearTimeout(t); db = null; zetStatus(OPSLAG_LOKAAL, true); }
  } catch (e) {}
})();
})();
</script>
